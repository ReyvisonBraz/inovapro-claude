name: Apply migrations

# Aplica migrations de PRODUÇÃO de forma deliberada e rastreável, com o schema
# do commit atual da `main`. Não roda em push: o trigger é manual (Actions →
# "Apply migrations" → Run workflow). Use antes de publicar uma mudança de
# schema, ou quando o check "Migrations drift" apontar pendências.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente-alvo
        required: false
        default: production
        type: choice
        options:
          - production

permissions:
  contents: read

env:
  DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

jobs:
  migrate:
    name: prisma migrate deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checar secret configurada
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Secret PRODUCTION_DATABASE_URL não configurado. Adicione em Settings → Secrets and variables → Actions (usar a MESMA URL do DATABASE_URL de produção da Vercel)."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Status final
        run: npx prisma migrate status
